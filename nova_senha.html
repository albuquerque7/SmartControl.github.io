<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de nova senha</title>
</head>
<body>
    <header>
            <nav>
                <img src="assets/images/logo.png" alt="Logo da empresa">
        </nav>
    </header>
    <h1>Digite sua nova senha</h1>
    <form action="index.html" method="get">
         <label for ="nova_senha">Nova senha:</label>
        <input type="nova_senha" id="nova_senha" placeholder="Digite a nova senha" minlength="8" maxlength="20" required>
        <br><br>
         <label for ="confirm_senha">Confirme a nova senha:</label>
        <input type="confirm_senha" id="confirm_senha" placeholder="Confirme a senha..." minlength="8" maxlength="20" required>
        <br><br>

        <button type="submit">Confirmar senha</button> 
    </form>
    
</body>
</html>
