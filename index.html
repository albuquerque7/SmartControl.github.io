<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="icon" href="assets/images/unnamed.png">
    <title>SmartControl - Login</title>
</head>
<body>
    <main class="container">
        <div class="cab" id="lado_esquerdo">
            <img src="assets/images/logo-sem-fundo.png" alt="Logo da empresa" id="logo_empresa">
            <div class="titulos">
                <h1 id="boasvindas">Seja bem-vindo ao Frebunda Company</h1>
                <h2 id="login">Faça o Login na sua conta!</h2>
            </div>
            <div class="rodape">
                <p>&copy; 2026 Meu site. Todos os direitos reservados. </p>
                <ul id="lista_rodape">
                    <li><a href="https://pedrotech.com.br/pedrolandia/" target="_blank" id="saiba_mais">Saiba mais.</a></li>
                    <li><a href="https://pedrotech.com.br/pedrolandia/" id="sobre">Sobre</a></li>
                    <li><a href="#" id="ctt">Contato</a></li>
                </ul>
            </div>
        </div>
        
        <div class="campos">

            <div class="ft_perfil">
                <img src="assets/images/icone_usuario.jpg" alt="icone de perfil" width="200" height="200" id="foto_perfil">
            </div>
            <form action="dashboard.html" method="get">
                <label for ="email"id="email_legend">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email..." required>
                <label for ="senha"id="senha_legend">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha..." required>
                    <div class="botoes">
                        <a href="cadastro.html" id="cadastro">Cadastrar-se</a>
                        <button type="submit"id="login_zinho">Login</button>
                        <a href="rec_senha.html"id="esq_senha">Esqueci a senha</a>
                    </div>
            </form>
    </main>
</body>
</html>
