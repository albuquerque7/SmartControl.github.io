<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="icon" href="assets/images/unnamed.png">
    <title>SmartControl - Login</title>
</head>
<body> 
    <div class="cab" id="lado_esquerdo">
        <img src="assets/images/logo-sem-fundo.png" alt="Logo da empresa" id="logo_empresa">
        <div class="titulos">
            <h1 id="boasvindas">Seja bem-vindo ao Frebunda Company</h1>
            <h2 id="login">Faça o Login na sua conta!</h2>
        </div>
        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank" id="saiba_mais">Saiba mais.</a>
    </div>
    <main class="container"> 

        <div class="ft_perfil">
            <img src="assets/images/icone_usuario.jpg" alt="icone de perfil" width="200" height="200" id="foto_perfil">
            <br>
        </div>
        
        <div class="campos">
            <form action="dashboard.html" method="get">
                
                <label for ="email">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
                <br><br>

                <label for ="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha..." required>
            </div>
                <br><br>
        <div class="botoes">
                <a href="cadastro.html">Cadastrar-se</a>
                <button type="submit">Login</button>
                <a href="rec_senha.html">Esqueci a senha</a>
            </form>
        </div>
    </main>

    <div class="rodape">
        <footer>
            <p>&copy; 2026 Meu site. Todos os direitos reservados. </p>
            <ul>
                <li><a href="https://pedrotech.com.br/pedrolandia/">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </footer>
    </div>
</body>
</html>
