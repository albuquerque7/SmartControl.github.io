<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Login</title>
    <style>
        body {
            color:rgb(219, 169, 62);
            font-size: 20px;
        }
    </style>
</head>
<body style="background-color: rgb(158, 10, 10);">
    <img src="assets/images/img_fundo.png" alt="plano de fundo de automação de carros">
    <h1>SmartControl - Frebunda Company</h1>
    <img src="assets/images/Perfil da empresa.png" alt="">
    <p>Seja bem-vindo ao Frebunda Company</p>
    <p>Faça o Login na sua conta!</p>

    <form>
        <img src="assets/images/icone_usuario.jpg" alt="icone de perfil" width="200" height="200"><br>
        
        <label for ="email">Email:</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
        <br><br>

        <label for ="senha">Senha:</label>
        <input type="senha" id="senha" placeholder="Digite sua senha..." required>
        <br><br>

        <button type="button">Cadastrar-se</button>
        <button type="submit">Login</button>
        <button type="button">Saiba mais.</button>
    </form>
</body>
</html>
